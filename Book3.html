<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My feedback form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

     <h2>Please check all the emotions that apply to you:</h2>
     <label for="angry">Angry</label>
     <input type="checkbox" id="angry" name="emotion" value="angry"><br>
     <label for="sad">Sad</label>
     <input type="checkbox" id="sad" name="emotion" value="sad"><br>
      <label for="happy">Happy</label>
     <input type="checkbox" id="happy" name="emotion" value="happy"><br>
     <label for="ambivalent">Ambivalent</label>
     <input type="checkbox" id="ambivalent" name="emotion" value="ambivalent"><br>

     <h3>How satisfied were you with our service</h3>
    
     </li><input type="radio" id="very-satisfied" name="satisfaction" value="very-satisfied">
     <label for="very-satisfied">Very Satisfied</label><br>
    
     <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
     <label for="satisfied">Satisfied</label><br>   
    
     <input type="radio" id="Didn't care" name="satisfaction" value="Didn't care">
     <label for="Didn't care">Didn't care</label><br>
    
     <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
     <label for="dissatisfied">Dissatisfied</label><br>

     <input type="radio" id="very-dissatisfied" name="satisfaction" value="very-dissatisfied">
     <label for="very-dissatisfied">Very Dissatisfied</label><br>

     <h4>Further comments:</h4>
     <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>

     <h5>Bio photo</h5>
     <input type="file" id="bio-photo" name="bio-photo" accept="image/*'>

     <h6>Location visited:</h6>
     <select id="location" name="location">
         <option value="mangalore">Mangaluru</option>
         <option value="bangalore">Bengaluru</option>
       </select>

</form>
</body>
</html>
